; Yerel/CI PgBouncer yapılandırması (T-002d). Yalnızca docker compose içindir; Neon'da
; pooler sağlayıcı tarafından yönetilir (ADR-004, Q-02).
;
; Bu dosya şablondur: `__BUYUK_HARF__` biçimindeki yer tutucuları docker-compose.yml
; içindeki pgbouncer giriş komutu ortam değişkenlerinden doldurur ve sonucu konteyner
; içinde /tmp/pgbouncer/pgbouncer.ini olarak yazar. Parola bu dosyaya hiç girmez.
; PgBouncer ini dosyasında ortam değişkeni açılımı olmadığı için bu yol seçildi.

[databases]
; İstemcinin bağlandığı veritabanı adı = postgres konteynerindeki POSTGRES_DB.
; Sunucu tarafı kullanıcı/parola istemcininkiyle aynıdır (auth_file'dan alınır).
__POSTGRES_DB__ = host=postgres port=5432 dbname=__POSTGRES_DB__

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; AC-05 ve tüm pooler kanıtı transaction mode ister (docs/spec/02-tenancy-auth.md §Pooler uyumluluğu).
pool_mode = session

; PGBOUNCER_DEFAULT_POOL_SIZE ile ayarlanır; AC-05 için 1–2'ye düşürülür.
default_pool_size = __DEFAULT_POOL_SIZE__

; Q-02/Q-04 ile eşitlenecek alan. Varsayılan 1000 = Neon belgesinde yayımlanan
; Neon PgBouncer değeri (docs/connect/connection-pooling). PGBOUNCER_MAX_PREPARED_STATEMENTS ile değişir.
max_prepared_statements = __MAX_PREPARED_STATEMENTS__

; Neon belgesindeki değerlerle aynı tutulur (Q-02 eşdeğerliği).
max_client_conn = 10000
query_wait_timeout = 120

; Kimlik doğrulama: userlist (auth_file). Dosya konteyner başlarken ortam
; değişkenlerinden /tmp altında üretilir; repoya ve imaja girmez.
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt

; Yönetim konsolu (SHOW CONFIG vb.) yalnızca PgBouncer'a özgü yönetici kullanıcıya açıktır;
; uygulama rolü wms_app yönetici değildir.
admin_users = pgbouncer_admin

ignore_startup_parameters = extra_float_digits
